<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Lista de Corridas</h2>
    <button class="btn btn-primary" routerLink="/corridas/novo">Nova Corrida</button>
  </div>

  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Data</th>
        <th>Local</th>
        <th>Distâncias (Km)</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let corrida of corridas">
        <td>{{ corrida.nome }}</td>
        <td>{{ corrida.data | date:'dd/MM/yyyy' }}</td>
        <td>{{ corrida.local }}</td>
        <td>{{ corrida.distancias?.join(', ') }} Km</td>
        <td>
          <button class="btn btn-sm btn-info me-2" [routerLink]="['/corridas/exibe', corrida.id]">Ver</button>
          <button class="btn btn-sm btn-warning me-2" [routerLink]="['/corridas/edita', corrida.id]">Editar</button>
          <button class="btn btn-sm btn-danger" (click)="deletar(corrida.id)">Excluir</button>
        </td>
      </tr>
      <tr *ngIf="corridas.length === 0">
        <td colspan="5" class="text-center text-muted">Nenhuma corrida cadastrada.</td>
      </tr>
    </tbody>
  </table>
</div>
