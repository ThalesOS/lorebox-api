<div class="mb-6 flex items-center justify-between">
  <h2 class="text-2xl font-semibold text-slate-800">Lista de Corridas</h2>
  <a
    routerLink="/corridas/novo"
    class="rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700"
  >
    Nova Corrida
  </a>
</div>

<div class="overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
  <table class="w-full text-left text-sm">
    <thead class="bg-gray-100 text-xs uppercase text-gray-500">
      <tr>
        <th class="px-4 py-3">Nome</th>
        <th class="px-4 py-3">Data</th>
        <th class="px-4 py-3">Local</th>
        <th class="px-4 py-3">Distâncias (km)</th>
        <th class="px-4 py-3"></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
      @for (corrida of corridas; track corrida.id) {
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-3 font-medium text-slate-800">{{ corrida.nome }}</td>
          <td class="px-4 py-3 text-slate-600">{{ corrida.data | date: 'dd/MM/yyyy' }}</td>
          <td class="px-4 py-3 text-slate-600">{{ corrida.local }}</td>
          <td class="px-4 py-3 text-slate-600">{{ corrida.distancias.join(', ') }} km</td>
          <td class="px-4 py-3">
            <div class="flex justify-end gap-3">
              <a [routerLink]="['/corridas', corrida.id]" class="text-slate-600 hover:text-slate-900">Ver</a>
              <a [routerLink]="['/corridas', corrida.id, 'editar']" class="text-blue-600 hover:text-blue-800">Editar</a>
              <button (click)="deletar(corrida.id)" class="text-red-600 hover:text-red-800">Excluir</button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="px-4 py-6 text-center text-slate-500">Nenhuma corrida cadastrada.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
