<h2 class="mb-6 text-2xl font-semibold text-slate-800">Corrida</h2>

@if (corrida) {
  <dl class="max-w-md space-y-3 rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
    <div>
      <dt class="text-xs font-medium uppercase text-gray-500">Nome</dt>
      <dd class="text-sm text-slate-800">{{ corrida.nome }}</dd>
    </div>
    <div>
      <dt class="text-xs font-medium uppercase text-gray-500">Data</dt>
      <dd class="text-sm text-slate-800">{{ corrida.data | date: 'dd/MM/yyyy' }}</dd>
    </div>
    <div>
      <dt class="text-xs font-medium uppercase text-gray-500">Local</dt>
      <dd class="text-sm text-slate-800">{{ corrida.local }}</dd>
    </div>
    <div>
      <dt class="text-xs font-medium uppercase text-gray-500">Distâncias disponíveis</dt>
      <dd class="text-sm text-slate-800">{{ corrida.distancias.join(', ') }} km</dd>
    </div>
  </dl>

  <a
    [routerLink]="['/corridas', corrida.id, 'editar']"
    class="mt-4 inline-block rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700"
  >
    Editar
  </a>
}

<a routerLink="/corridas" class="mt-4 block text-sm text-slate-600 hover:text-slate-900">
  Ir para Lista de Corridas
</a>
