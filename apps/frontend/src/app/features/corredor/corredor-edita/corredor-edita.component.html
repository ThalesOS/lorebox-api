<h2 class="mb-6 text-2xl font-semibold text-slate-800">Editar Corredor</h2>

<form [formGroup]="form" (ngSubmit)="salvar()" class="max-w-md space-y-4 rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
  <div>
    <label class="mb-1 block text-sm font-medium text-slate-700">Nome</label>
    <input
      formControlName="nome"
      placeholder="Nome"
      class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
    />
  </div>

  <div>
    <label class="mb-1 block text-sm font-medium text-slate-700">CPF</label>
    <input
      formControlName="cpf"
      placeholder="CPF"
      class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
    />
  </div>

  <div>
    <label class="mb-1 block text-sm font-medium text-slate-700">Data de nascimento</label>
    <input
      formControlName="dataNascimento"
      type="date"
      class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
    />
  </div>

  <div>
    <label class="mb-1 block text-sm font-medium text-slate-700">Gênero</label>
    <select
      formControlName="genero"
      class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
    >
      <option value="MASCULINO">Masculino</option>
      <option value="FEMININO">Feminino</option>
    </select>
  </div>

  <button
    type="submit"
    [disabled]="form.invalid"
    class="rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-50"
  >
    Salvar
  </button>
</form>

<a routerLink="/corredores" class="mt-4 inline-block text-sm text-slate-600 hover:text-slate-900">
  Ir para Lista de Corredores
</a>
